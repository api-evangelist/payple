name: Payple
description: >-
  Payple (페이플) is a South Korean payment gateway (PG) and fintech provider that
  lets merchants accept online payments across domestic and international cards,
  real-time bank-account payments, recurring / billing-key charges, link
  payments, identity verification, and settlement / payout (Hub) services.
  Integration is offered through a hosted payment window initialized in the
  browser with a public client key, plus a server-side REST API (v2) authorized
  with partner credentials (PCD_CST_ID / PCD_CUST_KEY). Payple is a registered
  Korean electronic financial business with an Innovative Financial Service
  (혁신금융서비스) designation, and it publishes official language sample source,
  policy documents, and a developer center. This profile was enriched by the API
  Evangelist pipeline from the Payple developer center and the PAYPLECORP GitHub
  organization.
